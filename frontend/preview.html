  <style>
    :root {

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { background: var(--ink); color: var(--ivory); }
    body { font-family: "Instrument Sans", "IBM Plex Sans Arabic", sans-serif; min-height: 100vh; }
    [dir="rtl"] body { font-family: "IBM Plex Sans Arabic", "Instrument Sans", sans-serif; }
    a { color: inherit; text-decoration: none; }
    button { font: inherit; cursor: pointer; border: 0; background: none; color: inherit; }
    .display { font-family: Syne, "IBM Plex Sans Arabic", sans-serif; letter-spacing: -0.02em; }
    .wrap { width: min(1200px, calc(100% - 40px)); margin-inline: auto; }
    header {
      position: sticky; top: 0; z-index: 40; height: 72px;
      display: flex; align-items: center; justify-content: space-between; gap: 16px;
      background: rgba(11,12,14,.8); backdrop-filter: blur(12px); border-bottom: 1px solid var(--line);
      padding-inline: max(20px, calc(50% - 600px));
    }
    .logo { display: flex; align-items: center; gap: 12px; }
    .circle {
      width: 36px; height: 36px; border-radius: 50%; background: var(--gold); color: var(--ink);
      display: grid; place-items: center; font-family: Syne, sans-serif; font-weight: 700; font-size: 12px;

    nav { display: flex; gap: 28px; font-size: 14px; color: rgba(244,239,230,.8); }
    .end { display: flex; gap: 8px; align-items: center; }
    .icon-btn, .lang {
      height: 44px; min-width: 44px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--line);
      display: grid; place-items: center; position: relative;
    }
    .badge {
      position: absolute; top: -4px; inset-inline-end: -4px; background: var(--gold); color: var(--ink);

    }
    .btn {
      height: 48px; padding: 0 24px; border-radius: 999px; background: var(--gold); color: var(--ink); font-weight: 500;
      display: inline-grid; place-items: center;

  </style>
</head>

          ${xs.length?`<p class="gold" style="font-size:12px;letter-spacing:.16em;margin:16px 0 8px">${ar()?"كمّل النظام":"COMPLETE THE SYSTEM"}</p>`+xs.map(p=>`<div class="box" style="display:flex;gap:10px;align-items:center;margin-bottom:8px"><div style="width:44px;height:56px;overflow:hidden;border-radius:6px">${cover(p)}</div><div style="flex:1"><p>${p.name[locale]}</p><p class="gold">$${p.price|| (p.type==="addon"?12:19)}</p></div><button class="btn" style="height:36px;padding:0 12px" data-xs="${p.slug}">${ar()?"أضف":"Add"}</button></div>`).join(""):""}
        </div>
        <div style="padding:16px 20px;border-top:1px solid var(--line)">
          <p style="display:flex;justify-content:space-between">${ar()?"المجموع":"Subtotal"} <span class="display gold" style="font-size:22px">$${total()}</span></p>
          <p class="stone" style="font-size:11px;margin:8px 0">${ar()?"تسليم رقمي فوري · رخصة شخصية":"Instant digital · personal license"}</p>
          <button class="btn" style="width:100%" id="toCheck" ${cart.length?"":"disabled"}>${ar()?"أكّد بياناتك":"Confirm details"}</button>
          <button style="width:100%;margin-top:8px" class="stone" id="keep">${ar()?"كمّل تسوّق":"Continue shopping"}</button>
        </div>`;
      d.querySelector("#closeCart").onclick = closeCart;
      d.querySelector("#keep").onclick = closeCart;
      o.onclick = closeCart;
      d.querySelectorAll("[data-rm]").forEach(el => el.onclick = () => { cart.splice(+el.dataset.rm,1); save(); renderChrome(); openCart(); });
      d.querySelectorAll("[data-xs]").forEach(el => el.onclick = () => {
        const p = gp(el.dataset.xs);
        cart.push({ sku:p.sku, slug:p.slug, offer:"solo", price: p.type==="addon"?12:p.type==="vault"?97:19, label: ar()?"رخصة":"1 license" });
        save(); renderChrome(); openCart();
      });
      d.querySelector("#toCheck").onclick = () => { if (cart.length) openCheckout(); };
    }
    function closeCart() {
      document.getElementById("drawer").hidden = true;
      document.getElementById("cartOverlay").hidden = true;
    }

    function openCheckout() {
      closeCart();
      document.getElementById("checkDim").hidden = false;
      const m = document.getElementById("checkout");
      m.hidden = false;
      m.innerHTML = `
        <p class="gold" style="letter-spacing:.18em;font-size:12px">${ar()?"آخر خطوة":"LAST STEP"}</p>
        <h2 class="display" style="font-size:32px;margin:8px 0">${ar()?"قربت تصير لك":"Almost yours"}</h2>
        <p class="stone">${ar()?"الاسم والإيميل. الخزنة توصلك.":"Name + email. We send the vault."}</p>
        <div class="box" style="margin:16px 0">${cart.map(l=>`<p style="display:flex;justify-content:space-between"><span>${gp(l.slug).name[locale]} · ${l.label}</span><span class="gold">$${l.price}</span></p>`).join("")}
        <p style="display:flex;justify-content:space-between;margin-top:8px">${ar()?"المجموع":"Total"} <span class="display gold" style="font-size:22px">$${total()} USD</span></p></div>
        <p class="stone" style="font-size:12px;margin-bottom:12px">${ar()?"تقييم 4.9 · رخص محدودة هذا الدروب":"4.9 rating · limited licenses this drop"}</p>
        <form id="cf">
          <label class="stone">${ar()?"الاسم":"Name"}<input name="name" required></label>
          <label class="stone" style="display:block;margin-top:10px">Email<input name="email" type="email" dir="ltr" required></label>
          <button class="btn" style="width:100%;margin-top:14px">${ar()?"أرسل لي الخزنة":"Get my vault"}</button>
          <p class="stone" style="font-size:11px;text-align:center;margin-top:8px">${ar()?"وصلك الإيميل خلال دقايق.":"We email your next step in minutes."}</p>
        </form>`;
      document.getElementById("checkDim").onclick = closeCheck;
      document.getElementById("cf").onsubmit = e => {
        e.preventDefault();
        const fd = new FormData(e.target);
        lastOrder = { id: "DW"+Date.now().toString(36).toUpperCase(), name: fd.get("name"), email: fd.get("email"), lines: [...cart], total: total() };
        sessionStorage.setItem("dw_last_order", JSON.stringify(lastOrder));
        closeCheck();
        openUpsell();
      };
    }
    function closeCheck() {
      document.getElementById("checkDim").hidden = true;
      document.getElementById("checkout").hidden = true;
    }

    function pickUpsell() {
      if (has("the-vault")) return null;
      const first = cart[0] && gp(cart[0].slug);
      if (first && first.up && !has(first.up.slug)) return first.up;
      if (!has("launch-sprint")) return { slug:"launch-sprint", price:9 };
      if (!has("the-vault")) return { slug:"the-vault", price:67 };
      return null;
    }

    function openUpsell() {
      const u = pickUpsell();
      if (!u) return goThanks();
      const p = gp(u.slug);
      const box = document.getElementById("upsellDim");
      box.hidden = false;
      let s = 12;
      box.innerHTML = `<div class="modal" style="position:relative;top:auto;text-align:center">
        <p class="display gold" style="font-size:42px" id="sec">12</p>
        <h3 class="display" style="font-size:26px;margin:8px 0">${ar()?"لحظة — في باب لسه مفتوح":"Wait — one door still open"}</h3>
        <p class="stone">${ar()?`${p.name.ar} بـ ${u.price}$. السعر هذا ما ينحط في الموقع.`:`${p.name.en} at $${u.price}. Never this price on the site.`}</p>
        <button class="btn" style="width:100%;margin-top:20px" id="yes">${ar()?`أضفه — ${u.price}$`:`Add it — $${u.price}`}</button>
        <button class="stone" style="width:100%;margin-top:10px" id="no">${ar()?"لا، كمل":"No thanks"}</button>
      </div>`;
      const tick = () => { s--; const el = document.getElementById("sec"); if (!el) return; el.textContent = s; if (s<=0) goThanks(); };
      upsellTimer = setInterval(tick, 1000);
      document.getElementById("yes").onclick = () => {
        lastOrder.lines.push({ sku:p.sku, slug:p.slug, offer:"upsell", price:u.price, label:"upsell" });
        lastOrder.total += u.price;
        sessionStorage.setItem("dw_last_order", JSON.stringify(lastOrder));
        goThanks();
      };
      document.getElementById("no").onclick = goThanks;
    }

    function goThanks() {
      clearInterval(upsellTimer);
      document.getElementById("upsellDim").hidden = true;
      cart = []; save(); renderChrome();
      location.hash = "#/thanks";
    }

    document.getElementById("lang").onclick = () => setLocale(ar() ? "en" : "ar");
    document.getElementById("cartBtn").onclick = openCart;
    document.getElementById("ham").onclick = () => document.getElementById("menu").classList.add("open");
    document.getElementById("menu").onclick = e => {
      if (e.target.id === "closeMenu" || e.target.tagName === "A") document.getElementById("menu").classList.remove("open");
    };

    function parseHash() {
      const h = (location.hash || "#/home").replace(/^#\//,"");
      const [r, p] = h.split("/");
      route = r || "home";
      param = p || "";
      if (route === "system") offer = gp(param)?.type === "addon" ? "addon" : "duo";
      renderChrome();
      render();
    }
    window.addEventListener("hashchange", parseHash);
    setLocale(locale);
    parseHash();
  </script>
</body>
</html>
