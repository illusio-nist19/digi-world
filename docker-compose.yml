services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: digi-world
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d digi-world"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      APP_ENV: development
      DATABASE_URL: postgres://postgres:postgres@db:5432/digi-world?sslmode=disable
      FRONTEND_ORIGINS: http://localhost:3000,http://localhost:3001,http://localhost:3002,https://digi-world.online,https://www.digi-world.online
      CHECKOUT_MODE: stripe
      DELIVERY_MODE: instant
      STORE_URL: http://localhost:3000
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
    depends_on:
      db:
        condition: service_healthy
