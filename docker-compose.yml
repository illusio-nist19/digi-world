services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: digi-world
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d digi-world"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      APP_ENV: development
      DATABASE_URL: postgres://postgres:postgres@db:5432/digi-world?sslmode=disable
      FRONTEND_ORIGINS: http://localhost:3000,http://localhost:3001,http://localhost:3002,https://digi-world.online,https://www.digi-world.online
      CHECKOUT_MODE: lead
      DELIVERY_MODE: instant
      STORE_URL: http://localhost:3000
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      SOCIAL_AUTO_ANNOUNCE: ${SOCIAL_AUTO_ANNOUNCE:-false}
      META_PAGE_ID: ${META_PAGE_ID:-}
      META_PAGE_ACCESS_TOKEN: ${META_PAGE_ACCESS_TOKEN:-}
      META_IG_USER_ID: ${META_IG_USER_ID:-}
      TIKTOK_PUBLISH_ACCESS_TOKEN: ${TIKTOK_PUBLISH_ACCESS_TOKEN:-}
      TIKTOK_PRIVACY_LEVEL: ${TIKTOK_PRIVACY_LEVEL:-SELF_ONLY}
      TIKTOK_CLIENT_KEY: ${TIKTOK_CLIENT_KEY:-}
      TIKTOK_CLIENT_SECRET: ${TIKTOK_CLIENT_SECRET:-}
      TIKTOK_REDIRECT_URI: ${TIKTOK_REDIRECT_URI:-https://digi-world.online/en/ops/social}
    depends_on:
      db:
        condition: service_healthy
